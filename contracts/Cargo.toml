[package]
name = "pal-contracts"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "20.4.0"

[dev-dependencies]
soroban-sdk = { version = "20.4.0", features = ["testutils"] }
derive_arbitrary = "=1.3.2"

[profile.release]
opt-level = "z"
strip = true
lto = true
